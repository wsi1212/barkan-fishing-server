# NPC 대화창 — 우리 그림 (Codex 납품본을 320px로 늘린 것).
#
# ★폭 320이 상한이다. 마크는 GUI 배율을 아무리 올려도 가상 화면을 최소 320x240으로
#   보정하므로, 이보다 넓으면 작은 화면 유저는 양끝이 잘린다.
# ★한 장으로 두면 렌더가 안 된다. 마크는 이미지를 폰트 글리프로 넣는데 폭이 크면
#   아틀라스에 못 들어가고 에러 없이 조용히 사라진다.
#   실측: 52·110·144는 나오고 217·300은 안 나옴 -> 80px씩 4조각으로 자른다.
# ★파일명 소문자만. height 1짜리 글리프 금지(폰트 전체가 거부된다).
dialogue_panel_1:
  type: single
  file: dialogue/dialogue-panel-1.png
dialogue_panel_2:
  type: single
  file: dialogue/dialogue-panel-2.png
dialogue_panel_3:
  type: single
  file: dialogue/dialogue-panel-3.png
dialogue_panel_4:
  type: single
  file: dialogue/dialogue-panel-4.png

# 명패는 초상화 밑에 온다. 110 그대로면 화면 왼쪽으로 2px 나가서 0.85배로 줄였다.
dialogue_nameplate:
  type: single
  file: dialogue/dialogue-nameplate.png
  setting:
    scale: 0.85

# 액자 홈(76x82)에 맞춘 크기. 원본 89x138 -> 0.58배 = 52x80.
npc_dialogue_portrait:
  type: single
  file: dialogue/portrait-grandfather-hud.png
  setting:
    scale: 0.58
