# NPC 대화창 — Codex 납품 원본(300x114)의 양피지 안쪽 세로띠를 반복해 400x114로 늘린 것.
# 늘린 스크립트와 원본은 gui-forge/src/dialogue/ 에 있다(dialogue-panel.png -> -400.png).
#
# ★폭 한계: 마크는 GUI 배율을 올려도 가상 화면을 최소 320x240으로 보정한다. 다만
#   16:9 화면에서는 세로(240) 제약이 먼저 걸려서 가로는 426까지 보장된다(240 x 16/9).
#   400은 16:9에서 좌우 13px 여유가 남는다. 4:3 같은 좁은 창에서는 양끝이 조금 잘린다.
# ★한 장으로 두면 렌더가 안 된다 — 폭이 크면 마크 폰트 아틀라스에 못 들어가고
#   에러 없이 조용히 사라진다(실측: 144는 되고 217/300은 안 됨). 80px씩 5조각.
# ★파일명 소문자만. height 1짜리 글리프 금지.
dialogue_panel_1:
  type: single
  file: dialogue/dialogue-panel-1.png
dialogue_panel_2:
  type: single
  file: dialogue/dialogue-panel-2.png
dialogue_panel_3:
  type: single
  file: dialogue/dialogue-panel-3.png
dialogue_panel_4:
  type: single
  file: dialogue/dialogue-panel-4.png
dialogue_panel_5:
  type: single
  file: dialogue/dialogue-panel-5.png

# 명패는 원본 크기(110)로 쓴다. 이름이 여기 안에 들어가야 하므로 줄이지 않는다.
dialogue_nameplate:
  type: single
  file: dialogue/dialogue-nameplate.png

# 액자 홈(76x82)에 맞춘 크기. 원본 89x138 -> 0.58배 = 52x80.
npc_dialogue_portrait:
  type: single
  file: dialogue/portrait-grandfather-hud.png
  setting:
    scale: 0.58
