# ★★이 파일은 gen_hud_sizes.py 가 생성한다. 손으로 고치지 말 것 —
#   크기 단계가 4 벌이라 손으로 고치면 한 벌만 바뀌고 나머지가 어긋난다.
#   좌표를 바꾸려면 gen_hud_sizes.py 의 STATUS/PLACE 를 고치고 다시 돌린다.
status_plate_sm:
  type: single
  file: status/gen/status-plate-sm.png
  setting:
    scale: 0.5

status_icon_0_sm:
  type: single
  file: status/gen/icon-coin-sm.png
  setting:
    scale: 0.5333

status_icon_1_sm:
  type: single
  file: status/gen/icon-star-sm.png
  setting:
    scale: 0.5

status_icon_2_sm:
  type: single
  file: status/gen/icon-gem-sm.png
  setting:
    scale: 0.5

exp_bar_empty_sm:
  type: single
  file: status/gen/exp-bar-empty-sm.png
  setting:
    scale: 0.5

exp_bar_sm:
  type: listener
  file: status/gen/exp-bar-fill-sm.png
  split: 32
  split-type: left
  setting:
    scale: 0.5
    listener:
      class: barkan_exp

