# ★2026-08-09: 화면 대비 너무 커서 전부 0.66 배로 줄였다. 아트를 다시 굽지 않고
#   setting.scale 로 줄인다 — 어차피 0.66 은 비정수라 어느 쪽이든 리샘플이고,
#   숫자 하나만 되돌리면 원래 크기로 돌아온다.
#   ★scale 을 바꾸면 max(가장 넓은 이미지 폭)도 같이 바뀌어 레이아웃 x 가 전부 틀어진다.
# 오른쪽 위 상태 HUD 그림. 아트는 gui-forge/build_status_hud.py 가 굽는다(손으로 고치지 말 것).
#
# ★폭 160 이하 — 넘으면 폰트 글리프 아틀라스에 못 들어가고 에러 없이 조용히 사라진다.
#   판 110 이라 조각낼 필요가 없다(대화창 판 440 은 4조각이 필요했다).
# ★파일명 소문자만. height 1 글리프 금지.
# ★판이 가장 넓으므로 max = 110. 레이아웃 x 계산이 여기 물려 있다(status-layout.yml 참고).
status_plate:
  type: single
  file: status/status-plate.png
  setting:
    scale: 0.66

status_icon_coin:
  type: single
  file: status/icon-coin.png
  setting:
    scale: 0.66

status_icon_star:
  type: single
  file: status/icon-star.png
  setting:
    scale: 0.66

status_icon_gem:
  type: single
  file: status/icon-gem.png
  setting:
    scale: 0.66

# === 경험치 바 ===
# ★type: listener 는 리스너가 준 0.0~1.0 만큼 그림을 잘라 그린다(바닐라 체력바와 같은 방식).
#   글자 "||||" 와 달리 칸도 간격도 없는 진짜 게이지다.
# ★split = 잘리는 단계 수. 원본이 44px 이라 44 로 두면 1px(=약 2.3%) 단위가 된다.
# ★listener.class 의 barkan_exp 는 BlockShip(StatusHud)이 BetterHud API 로 등록한다.
#   BetterHud 가 먼저 켜져서 설정을 읽을 땐 아직 없으므로, BlockShip 이 등록 후 리로드를
#   한 번 건다. 이 이름이 없으면 이 이미지 정의가 파싱에 실패하니 같이 지우거나 같이 둘 것.
exp_bar_empty:
  type: single
  file: status/exp-bar-empty.png
  setting:
    scale: 0.66

exp_bar:
  type: listener
  file: status/exp-bar-fill.png
  split: 44
  split-type: left
  setting:
    scale: 0.66
    listener:
      class: barkan_exp
