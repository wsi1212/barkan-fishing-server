# ★★이 파일은 gen_hud_sizes.py 가 생성한다. 손으로 고치지 말 것 —
#   크기 단계가 4 벌이라 손으로 고치면 한 벌만 바뀌고 나머지가 어긋난다.
#   좌표를 바꾸려면 gen_hud_sizes.py 의 STATUS/PLACE 를 고치고 다시 돌린다.
status_plate_sm:
  type: single
  file: status/status-plate.png
  setting:
    scale: 0.5

status_icon_0_sm:
  type: single
  file: status/icon-coin.png
  setting:
    scale: 0.5

status_icon_1_sm:
  type: single
  file: status/icon-star.png
  setting:
    scale: 0.5

status_icon_2_sm:
  type: single
  file: status/icon-gem.png
  setting:
    scale: 0.5

exp_bar_empty_sm:
  type: single
  file: status/exp-bar-empty.png
  setting:
    scale: 0.5

exp_bar_sm:
  type: listener
  file: status/exp-bar-fill.png
  split: 36
  split-type: left
  setting:
    scale: 0.5
    listener:
      class: barkan_exp

