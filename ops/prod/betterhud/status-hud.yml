# 오른쪽 위 상태 HUD — 소지금 / 낚시 레벨+경험치 / 캐시.
#
# gui 는 화면 백분율 앵커다. x:100 y:0 = 오른쪽 위 모서리.
#   ★x:100 을 쓰는 이유: 해상도가 달라도 항상 오른쪽에 붙는다. 절대 좌표로 잡으면
#     넓은 화면에서 가운데로 떠 버린다.
#   ★세로는 셰이더 특성상 실제로 23px 더 위에 찍힌다(preview.py Y_BIAS 참고).
#     그래서 layout y 에 그만큼 더해 둔다.
#
# tick: 20 — 1초마다 다시 그린다. 소지금·경험치는 1초 지연이면 충분하고,
#   1틱으로 두면 접속자 수만큼 매 틱 렌더가 돌아 낭비다(대화창은 즉시성이 필요해 1).
barkan_status:
  tick: 20
  layouts:
    1:
      name: barkan_status_layout
      gui:
        x: 100
        y: 0
