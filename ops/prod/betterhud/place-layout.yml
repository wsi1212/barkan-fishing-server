# 앵커 = hud 의 gui(x0, y0) = 화면 왼쪽 위 모서리.
#
# ★좌표 공식: 요소 왼쪽끝 = 앵커x - max/2 + x,  max = 가장 넓은 이미지 = 판 150.
#   앵커x = 0 이므로  왼쪽끝 = x - 75  ->  "화면 왼쪽에서 N px" = x = N + 75.
#   ★판 폭(150)을 바꾸면 max 가 바뀌어 전부 틀어진다.
# ★세로: 실제로 찍히는 위치는 (앵커y + y) 보다 23px 위다(셰이더 상수, preview.py Y_BIAS).
#   앵커y = 0 이므로  "화면 위에서 N px" = y = N + 23.
#
# 판: 왼쪽에서 12px, 위에서 10px  ->  x = 87, y = 33.  판은 12~162, 10~52 를 차지한다.
# 판 안쪽 양피지 7~34. 두 줄을 12px 간격으로: 글자 위끝 = 판 y 9 / 21.
barkan_place_layout:
  align: left
  images:
    1:
      name: place_plate
      x: 87
      y: 33
  texts:
    # 두 줄 모두 BlockShip 이 완성해서 넣는다(색 포함).
    # ★크림색 양피지 위라 밝은 색은 안 보인다 — 자바 쪽에서 어두운 색으로 변환해 보낸다.
    1:
      name: dialogue_font
      pattern: "[string:hud_place]"
      color: "#4A3A22"
      x: 95
      y: 42
      scale: 0.62
      align: left
    2:
      name: dialogue_font
      pattern: "[string:hud_env]"
      color: "#4A3A22"
      x: 95
      y: 54
      scale: 0.62
      align: left
