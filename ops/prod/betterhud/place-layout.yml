# 앵커 = hud 의 gui(x0, y0) = 화면 왼쪽 위 모서리.
#
# ★좌표 공식: 요소 왼쪽끝 = 앵커x - max/2 + x.
#   0.66 배로 줄여서 max = 150 x 0.66 = 99, 앵커x = 0  ->  왼쪽끝 = x - 49.5
#   따라서 "화면 왼쪽에서 N px" = x = N + 49.5.
# ★세로 보정상수 없음(앵커y = 0) — y 가 곧 화면 y 다.
#
# 판(그려지는 크기 99x28): 왼쪽 3px, 위 3px  ->  x = 52.5, y = 3.
# 판 안쪽 양피지 5~23. 두 줄 간격 8, 글자 위끝 = 판 y 6 / 14. 글자 왼끝 = 판 x 9.
barkan_place_layout:
  align: left
  images:
    1:
      name: place_plate
      x: 52.5
      y: 3
  texts:
    # 두 줄 모두 BlockShip 이 완성해서 넣는다(색 포함).
    # ★크림색 양피지 위라 밝은 색은 안 보인다 — 자바 쪽에서 어두운 색으로 변환해 보낸다.
    # scale 0.41 = 원래 0.62 의 66%.
    1:
      name: dialogue_font
      pattern: "[string:hud_place]"
      color: "#4A3A22"
      x: 61.5
      y: 9
      scale: 0.41
      align: left
    2:
      name: dialogue_font
      pattern: "[string:hud_env]"
      color: "#4A3A22"
      x: 61.5
      y: 17
      scale: 0.41
      align: left
