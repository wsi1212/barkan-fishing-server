# HUD 전용 폰트. 대화창·상태판·위치판이 전부 이걸 쓴다.
#
# ★★aggro_medium_hud.ttf 는 build_hud_font.py 가 만든다(원본 어그로체 + 기호 7자).
#   손으로 만들지 말고 그 스크립트를 돌릴 것.
#
# ★merge-default-bitmap / use-unifont 를 켜지 말 것.
#   켜면 한글까지 유니폰트로 바뀌어 글꼴이 통째로 달라진다(2026-08-10 실측 확인).
#   원래 이 둘을 켠 이유는 어그로체에 ☀ ☁ ☂ ⚡ ❄ ≋ ☽ 가 없어서였는데,
#   그건 이제 폰트에 직접 넣어 해결했다. 즉 켤 이유가 사라졌다.
#   ※폰트에 없는 글자는 MC 기본 폰트로 폴백되고, 폴백 글리프는 BetterHud 의 위치
#     인코딩이 없어 셰이더가 못 옮긴다 -> 그 글자만 보스바 자리에 찍힌다.
#     HUD 에 새 기호를 쓰려면 반드시 build_hud_font.py 에 먼저 추가할 것.
dialogue_font:
  file: aggro_medium_hud.ttf
  scale: 16
  merge-default-bitmap: false
  use-unifont: false
