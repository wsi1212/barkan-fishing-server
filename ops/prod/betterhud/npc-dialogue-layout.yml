# 화면 하단 중앙. 앵커 = hud의 gui(x50,y100).
#
# ★align: center 필수. BetterHud 기본값 left 는 "왼쪽 끝 = x - max/2"라
#   (max = 레이아웃 안 가장 넓은 이미지 폭) 이미지 하나만 바꿔도 전부 밀린다.
#   center 면 "왼쪽 끝 = x - 자기폭/2" 이라 x가 그 요소 자신의 중심이 된다.
#   근거: BetterHud 소스 LayoutComponentContainer.kt / LayoutGroup.kt / HudParser.kt
# ★번호 = 그리는 순서. 판(1~5) 먼저, 그 위에 초상화(6)·명패(7).
#
# 판 400x114, 80px씩 5조각. 조각 중심 -160/-80/0/+80/+160 -> 화면 -200~+200.
# y는 요소의 위쪽 끝(음수가 위). 판 아래를 핫바 위에 붙이려면 y = -(114+22) = -136.
#
# 판 안 실측(판 왼쪽 위 기준) -> 화면(판 왼쪽 = -200):
#   액자 홈   16~91  (중심  53) -> 화면 -147
#   양피지   112~387 (중심 249) -> 화면  +49,  폭 275
npc_dialogue_layout:
  align: center
  images:
    1:
      name: dialogue_panel_1
      x: -160
      y: -136
    2:
      name: dialogue_panel_2
      x: -80
      y: -136
    3:
      name: dialogue_panel_3
      x: 0
      y: -136
    4:
      name: dialogue_panel_4
      x: 80
      y: -136
    5:
      name: dialogue_panel_5
      x: 160
      y: -136
    6:
      name: npc_dialogue_portrait
      x: -147
      y: -121
    7:
      name: dialogue_nameplate
      x: -147
      y: -56
  texts:
    1:
      name: dialogue_font
      pattern: "[string:npc_dialogue_text]"
      color: "#3D2840"
      x: 49
      y: -122
      scale: 1.0
      align: center
      line-align: left
      line: 4
      line-width: 20
      split-width: 250
      force-split: false
    2:
      name: dialogue_font
      pattern: "[string:npc_dialogue_name]"
      color: "#4A2D3D"
      x: -147
      y: -48
      scale: 0.6
      align: center
