# 화면 하단 중앙. 앵커 = hud의 gui(x50,y100).
# ★x/y = 이미지 "중심" 좌표. y는 음수가 위. 최소 화면은 중앙 기준 ±160.
#
# ★y는 요소의 '위쪽 끝'이고 음수가 위다. 패널(높이 114) 아래를 핫바 위에 붙이려면
#   y = -(114 + 22) = -136. 나머지는 패널 위쪽 기준 상대 위치로 계산했다.
# 나머지는 "패널 중심 + 패널 안에서의 상대 위치"로 계산했다 (영역은 그림에서 실측):
#   초상화 홈  패널기준 (-96, -2)  ->  화면 (-96, -87)
#   양피지     패널기준 (+50, -8)  ->  화면 (+50, -93)   폭 175 x 높이 82
npc_dialogue_layout:
  # ★align: center 는 필수다. BetterHud 기본값은 left 인데,
  #   left 이면 요소의 왼쪽 끝 = x - max/2 이고 max = "레이아웃 안에서 가장 넓은 이미지의 폭"이다.
  #   즉 이미지 하나만 크기를 바꿔도 나머지 요소가 전부 같이 밀려난다(2026-08-08 반나절 헤맴).
  #   center 이면 왼쪽 끝 = x - 자기폭/2 이라 x가 그 요소 자신의 중심이 되고 max와 무관해진다.
  #   근거: BetterHud 소스 LayoutComponentContainer.kt / LayoutGroup.kt / HudParser.kt
  align: center
  images:
    1:
      name: dialogue_panel
      x: 0
      y: -136
    2:
      name: npc_dialogue_portrait
      x: -96
      y: -121
    3:
      name: dialogue_nameplate
      x: -78
      y: -56
  texts:
    1:
      name: dialogue_font
      pattern: "[string:npc_dialogue_text]"
      color: "#3D2840"
      x: 50
      y: -128
      scale: 1.0
      align: left
      line-align: left
      line: 4
      line-width: 20
      split-width: 168
      force-split: false
    2:
      name: dialogue_font
      pattern: "[string:npc_dialogue_name]"
      color: "#4A2D3D"
      x: -78
      y: -48
      scale: 0.85
      align: center
