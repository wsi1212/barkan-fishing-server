# Install as /etc/systemd/system/mcserver.service.d/maintenance-gate.conf.
# Turn the network gate on before every managed Paper stop.  The independent
# gate service observes Paper's down -> RCON-ready transition and removes its
# temporary redirect only after the next boot is actually ready for players.
[Unit]
Wants=barkan-maintenance-gate.service
After=barkan-maintenance-gate.service

[Service]
# systemd has no ExecStopPre.  Reset and reproduce the small upstream stop list
# so the gate is armed *before* Paper receives its `stop` command.  Keep this
# in sync if mcserver.service's three ExecStop lines ever change.  sudo is
# passwordless for ubuntu on this host; the leading '-' keeps a firewall issue
# from preventing the normal Paper shutdown.
ExecStop=
ExecStop=-/usr/bin/sudo -n /home/ubuntu/mcserver/scripts/maintenance-gate-control.sh enable
ExecStop=/usr/bin/tmux send-keys -t mc stop Enter
ExecStop=/bin/sleep 30
ExecStop=-/usr/bin/tmux kill-session -t mc
