# Keep Minecraft connectivity under the explicit 06:00 maintenance orchestrator.
# Unattended package upgrades must not independently restart the backend, proxy,
# or waiting room; restarting proxy and waiting together disconnects every client.
$nrconf{override_rc}->{qr(^mcserver\.service$)} = 0;
$nrconf{override_rc}->{qr(^barkan-velocity\.service$)} = 0;
$nrconf{override_rc}->{qr(^barkan-waiting\.service$)} = 0;

1;

