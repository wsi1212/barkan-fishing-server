# ─────────────────────────────────────────────────────────────────────────────
# BlockShip 빌드 + 부팅 스모크
#
# ★이 파일은 fish repo가 아니라 blockship-plugin repo의
#   .github/workflows/ 에 놓는다. (fish에서 돌리면 gradle 프로젝트가 없어 실패)
#   같이 옮길 것: ops/ci/paper-smoke-test.sh → blockship-plugin/ci/paper-smoke-test.sh
#
# 설계 의도 — 승격 게이트:
#   push        → 빌드 + 스모크까지만. staging 근처에도 안 간다.
#   수동 실행   → promote=true 일 때만 Release 발행 → 오라클이 당겨감.
#   이렇게 끊는 이유: 오라클의 06:00 데일리 유지보수는 staging에 있는 걸
#   무조건 적용한다. push마다 staging에 떨어지면 오타 하나가 다음날 라이브로 간다.
# ─────────────────────────────────────────────────────────────────────────────
name: build & smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      promote:
        description: "스모크 통과 시 Release 발행 (오라클 staging 승격용)"
        type: boolean
        default: false

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"        # prod = Azul Zulu 21, CI는 temurin 21로 충분

      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드
        run: ./gradlew build --no-daemon --stacktrace

      - name: jar 업로드
        uses: actions/upload-artifact@v4
        with:
          name: blockship-jar
          path: build/libs/BlockShip-*.jar
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-latest
    env:
      # ★prod 구동 버전과 일치시킬 것 — job 레벨이라 캐시 키에서도 보인다.
      #   CLAUDE.md 는 1.21.10 이라 적혀 있으나 plugins/ 에 1.21.11 용 jar
      #   (AxiomPaperPlugin-5.0.4-for-MC1.21.11, BarkanChess-1.21.11)가 있어 확인 필요.
      #   확인: ssh prod 'grep -o "1\.21\.[0-9]*" ~/mcserver/version_history.json | tail -1'
      MC_VERSION: "1.21.10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v4
        with:
          name: blockship-jar
          path: dist

      # Paper jar는 52MB — 매번 받지 말고 캐시한다 (빌드 번호별로 키가 갈림)
      - name: Paper 캐시
        uses: actions/cache@v4
        with:
          path: .paper-cache
          key: paper-${{ env.MC_VERSION }}-${{ hashFiles('ci/paper-smoke-test.sh') }}
          restore-keys: paper-

      # ── 의존 플러그인: 필요 없다 (2026-08-13 plugin.yml 실측) ──────────────
      #   name: BlockShip / main: com.blockship.BlockShipPlugin / api-version: '1.21'
      #   softdepend: [ BetterHud, BetterModel, ProtocolLib, Citizens, VotifierPlus ]
      #   ★hard depend 가 하나도 없다 → 의존 jar 없이 로드·enable 된다.
      #
      #   그래서 이 스모크는 오히려 더 민감하다: softdepend 를 가드 없이 쓰는 코드가
      #   있으면(예: PacketBlackbox 가 ProtocolLib 을 무조건 참조) 여기서 터진다.
      #   그건 오탐이 아니라 실제 버그다 — prod 에서 그 플러그인이 로드 실패하면
      #   같은 방식으로 깨진다.
      #
      #   만약 ProtocolLib 계열 클래스 오류로 실패하는데 "가드를 추가하는 게 아니라
      #   CI 에 넣고 싶다" 면 아래를 살려서 --plugin deps/ProtocolLib.jar 로 넘긴다.
      # - name: (선택) ProtocolLib 내려받기
      #   run: |
      #     mkdir -p deps
      #     curl -fsSL -o deps/ProtocolLib.jar \
      #       "https://github.com/dmulloy2/ProtocolLib/releases/latest/download/ProtocolLib.jar"

      - name: 부팅 스모크
        run: |
          chmod +x ci/paper-smoke-test.sh
          JAR=$(ls dist/BlockShip-*.jar | head -1)
          echo "테스트 대상: $JAR (Paper $MC_VERSION)"
          ci/paper-smoke-test.sh \
            --plugin "$JAR" \
            --expect-plugin BlockShip \
            --mc-version "$MC_VERSION" \
            --cache-dir .paper-cache \
            --workdir smoke-run \
            --timeout 240 \
            --keep
          # 플러그인 기능 경로까지 때리려면: --rcon-command "데이터리로드"

      - name: 실패 시 부팅 로그 첨부
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-boot-log
          path: smoke-run/boot.log
          retention-days: 14

  # 스모크를 통과한 것만 Release로 나간다. 오라클 cron이 이 Release를 당겨
  # ~/mcserver/staging/ 에 넣고, 06:00 데일리 유지보수가 적용한다.
  publish:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' && inputs.promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blockship-jar
          path: dist

      - name: Release 발행 (staging 승격)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "스모크 통과. 오라클 cron이 staging으로 당겨감 → 06:00 적용." \
            dist/BlockShip-*.jar
