# 놀이월드(playworld) 진입 시 추가로 밀어주는 리소스팩.
#  · 메인 팩은 server.properties 가 전원에게 준다. 이건 그 «위에 얹는» 팩이다.
#  · 리듬게임 곡 18개가 87MB 라 메인 팩에 합치지 않았다 — 놀이월드에 오는 사람만 받는다.
#  · url·sha1 이 비어 있으면 배급을 조용히 건너뛴다(월드는 그대로 쓸 수 있다).
#  · 값을 바꾼 뒤엔 /월드 리로드 (재시작 불필요).
playworld-pack:
  url: ""
  sha1: ""
  # true = 거부하면 접속이 끊긴다. 놀이월드는 스스로 찾아오는 곳이라 기본 true.
  required: true
  prompt: "&6놀이월드 &f추가 리소스팩을 받아주세요 (리듬게임 음원)"
