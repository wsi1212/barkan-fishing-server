0px;background:rgba(4,20,35,.36)}.related-docs b{width:100%}.related-docs a{padding:6px 9px;border:1px solid rgba(140,226,224,.26);border-radius:5px;color:#c9e9ec;font-size:12px;text-decoration:none}.related-docs a:hover{border-color:var(--gold);color:#ffe1a1}.doc-section{padding:25px 0;border-top:1px solid var(--line);scroll-margin-top:20px}.doc-section h3{margin:0 0 10px;color:var(--foam);font-size:22px;letter-spacing:-.06em}.doc-section h4{margin:19px 0 7px;color:var(--tide);font-size:15px}.doc-section p{margin:0;color:#bed0d5;font-size:14px}.doc-section p+p{margin-top:11px}.doc-section ul,.doc-section ol{margin:12px 0 0;padding-left:21px;color:#bed0d5;font-size:14px}.doc-section li+li{margin-top:6px}.doc-table{width:100%;margin:15px 0;border-collapse:collapse;font-size:13px}.doc-table th,.doc-table td{padding:10px 11px;border:1px solid rgba(213,240,242,.15);text-align:left}.doc-table th{background:rgba(140,226,224,.1);color:#dffafa;font-size:12px}.doc-table td{color:#bfd2d7}.doc-table tr:nth-child(even) td{background:rgba(5,18,31,.3)}.callout{margin:16px 0;padding:15px 17px;border-left:3px solid var(--gold);background:rgba(255,209,112,.08);color:#d7e5e8;font-size:13px}.fact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.fact{padding:14px;border:1px solid var(--line);border-radius:8px;background:rgba(5,18,31,.34)}.fact b{display:block;color:var(--gold);font-size:20px}.fact span{display:block;margin-top:3px;color:#a9c0c7;font-size:12px}.detail-page .masthead{padding:38px 0 28px}.detail-page .masthead h1{font-size:clamp(2.5rem,5vw,4.3rem)}.detail-page .masthead p:not(.kicker),.detail-page .search,.detail-page .search-count,.detail-page .toc,.detail-page #guides,.detail-page .empty,.detail-page .content-head{display:none}.detail-page .wiki-layout{display:block;padding-top:31px}.detail-page .article{margin:0}.footer{padding:38px 0 53px;border-top:1px solid var(--line);background:#050f1d}.footer-inner{display:flex;align-items:end;justify   <header class="shell masthead"><p class="kicker">BARKAN ISLANDS · FIELD GUIDE</p><h1>길을 잃지 않는<br><em>바르칸 위키.</em></h1><p>항구에서 첫 낚싯대를 잡는 순간부터 길드와 개인 섬을 꾸리는 때까지. 필요한 내용을 찾아 바로 게임으로 돌아가세요.</p><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" autocomplete="off" placeholder="예: 낚시, 섬 방문, 강화, 길드, 카지노"></label><p class="search-count" id="search-count">8개의 안내 문서</p></header>
  <main class="shell wiki-layout"><aside class="toc" aria-label="위키 목차"><b>EXPLORE</b><button class="active" data-filter="all">모든 문서</button><button data-filter="start">처음 시작</button><button data-filter="fishing">낚시와 장비</button><button data-filter="life">섬 생활</button><button data-filter="community">함께하기</button><button data-filter="economy">경제</button></aside><section><div class="content-head"><h2 id="section-title">바르칸을 알아가기</h2><p>카드를 누르면 상세 안내를 엽니다.</p></div><div class="guide-grid" id="guides"></div><div class="empty" id="empty">찾는 내용이 없어요.<br>다른 단어로 검색하거나 디스코드에서 문의해 주세요.</div><article class="article" id="article" aria-live="polite"></article></section></main>
  <footer class="footer"><div class="shell footer-inner"><div><a class="brand" href="/"><strong>BARKAN</strong><small>ISLANDS</small></a><p>바르칸 열도 · Minecraft Java & Bedrock Crossplay Server</p></div><div class="footer-links"><a href="https://discord.gg/fWVGGEbBsd" target="_blank" rel="noopener noreferrer">디스코드</a><a href="/ranking">랭킹</a><a href="/vip/">상점</a></div></div></footer>
  <script>
    (() => {
      const wikiLinks=document.querySelector('.nav .links');
      if(wikiLinks&&!wikiLinks.querySelector('a[href="/dex"]')){const dexLink=document.createElement('a');dexLink.href='/dex';dexLink.textContent='도감';wikiLinks.insertBefore(dexLink,wikiLinks.querySelector('.nav-discord'));}
      if(wikiLinks&&!wikiLinks.querySelector('a[href="/catalog"]')){const catalogLink=document.createElement('a');catalogLink.href='/catalog';catalogLink.textContent='재료';wikiLinks.insertBefore(catalogLink,wikiLinks.querySelector('.nav-discord'));}
      const docs=[
        {id:'start',group:'start',glyph:'⚓',title:'처음 시작하기',desc:'접속부터 항구에서 첫 낚싯대를 받는 방법까지.',tags:'접속 서버 주소 자바 베드락 버전 튜토리얼 스폰',intro:'바르칸 열도는 낚시와 탐험을 중심으로 성장하는 서버입니다. Java와 Bedrock 모두 접속할 수 있으며, 접속하면 항구의 안내를 따라 첫 장비와 기본 동선을 익혀 보세요.',blocks:[['접속 정보','<span class="command">barkan.kr</span><br>Java Edition · 1.21.4 ~ 1.26.2<br>Bedrock Edition 접속 지원 (Geyser)'],['첫 항해','항구를 둘러보며 안내 NPC와 대화하세요. 낚싯대를 손에 들고 물가에서 우클릭하면 낚시를 시작할 수 있습니다.'],['자주 쓰는 명령어','<span class="command">/레벨</span> 성장 확인<br><span class="command">/장비</span> 장비 확인<br><span class="command">/도감</span> 발견한 물고기 확인'],['막혔을 때','서버 안 안내를 다시 확인하거나 디스코드 문의 채널에 상황과 닉네임을 남겨 주세요.']]},
        {id:'fishing',group:'fishing',glyph:'🎣',title:'낚시와 성장',desc:'등급, 크기, 날씨와 장비가 만드는 낚시의 깊이.',tags:'낚시 등급 크기 미니게임 레벨 경험치 콤보 날씨',intro:'물고기의 등급과 크기는 보상에 영향을 주고, 장비·날씨·지역에 따라 만나는 대상도 달라집니다. 레벨을 올릴수록 새로운 장비와 콘텐츠가 열립니다.',blocks:[['낚시 기본','물가에서 낚싯대를 던지고, 입질 뒤 미니게임을 성공하면 물고기를 획득합니다. 물고기는 판매하거나 도감·제출에 활용할 수 있어요.'],['성장 확인','<span class="command">/레벨</span><br>현재 낚시 레벨과 성장 로드맵을 확인합니다.'],['판매와 보관','<span class="command">/판매</span> 가장 가까운 물고기 판매 NPC의 위치를 안내합니다.<br>아껴 둘 물고기는 아이스박스에 보관해 신선도를 관리하세요.'],['기록 경쟁','랭킹에서 낚시 레벨과 누적 어획을 확인할 수 있습니다.']]},
        {id:'gear',group:'fishing',glyph:'⚙',title:'장비와 강화',desc:'낚싯대와 부품을 조합해 자신만의 낚시 세팅을 만드세요.',tags:'장비 부품 강화 릴 줄 바늘 미끼 찌 내구도',intro:'낚싯대에 부품을 맞추고 강화해 낚시 성능을 끌어올릴 수 있습니다. 장비마다 레벨 제한과 서로 다른 능력치가 있어 목표 물고기에 맞춘 구성이 중요합니다.',blocks:[['장비 열기','<span class="command">/장비</span><br>현재 낚싯대와 장착 부품, 능력치를 확인합니다.'],['강화','<span class="command">/강화</span><br>낚싯대별 강화 메뉴를 엽니다. 강화에는 성공과 하락의 위험이 있으니 재료를 준비하세요.'],['부품','릴·줄·바늘·미끼·찌는 서로 다른 보너스를 제공합니다. 부품상점과 분해·조각 합성으로 새 부품을 얻을 수 있습니다.'],['관리','내구도가 떨어진 장비는 성능에 영향을 받을 수 있으니 장비 상태를 수시로 확인하세요.']]},
        {id:'island',group:'life',glyph:'🏝',title:'개인 섬',desc:'나만의 섬을 만들고, 공개·방문·워프를 관리하세요.',tags:'섬 개인섬 방문 초대 알바 워프 농사 가구',intro:'개인 섬은 혼자 운영하는 생활 공간입니다. 섬을 공개하면 다른 모험가가 방문할 수 있고, 섬의 환경과 권한·워프를 직접 관리합니다.',blocks:[['섬 만들기','<span class="command">/섬</span><br>섬이 없다면 생성하고, 있다면 관리 메뉴를 엽니다.'],['방문과 초대','<span class="command">/섬 방문 &lt;닉네임&gt;</span><br>공개된 다른 섬으로 이동합니다.<br><span class="command">/섬 초대 &lt;닉네임&gt;</span><br>알바생을 초대합니다.'],['생활 콘텐츠','섬에서 농사·요리·광질과 제작을 이어가고, 업그레이드로 경계·워프·가구 등의 한도를 넓힐 수 있습니다.'],['방문 기록','공개 섬의 방문 기록은 웹 랭킹의 섬 방문 탭에 반영됩니다.']]},
        {id:'guild',group:'community',glyph:'🛡',title:'길드',desc:'함께 기여하고 길드 섬을 키우는 공동 항해.',tags:'길드 길드섬 길드원 기여 제출 금고 랭킹',intro:'길드는 여러 플레이어가 하나의 목표를 세우고 함께 성장하는 단위입니다. 길드원 레벨, 금고, 제출 기여가 길드 성장과 랭킹에 반영됩니다.',blocks:[['길드에서 하는 일','길드원을 모으고 길드 섬을 관리하세요. 함께 모은 자원과 제출 기여로 더 높은 길드 레벨을 목표로 할 수 있습니다.'],['기여 랭킹','제출소에서 자원을 제출하면 섬과 길드 점수가 함께 쌓입니다. 시즌 점수는 월간 단위로 초기화될 수 있습니다.'],['웹 랭킹','위키 상단의 랭킹 페이지에서 길드 레벨 순위를 확인할 수 있습니다.'],['함께 플레이','거래·길드 채팅·섬 방문으로 다른 모험가와 연결됩니다.']]},
        {id:'economy',group:'economy',glyph:'✦',title:'경제와 거래',desc:'판매, 마켓, 수표와 송금으로 자산을 관리하세요.',tags:'경제 돈 판매 마켓 거래 수표 송금 캐시',intro:'바르칸의 경제는 낚시 판매와 생활 콘텐츠, 플레이어 간 거래를 중심으로 움직입니다. 필요한 물건은 마켓에서 찾고, 귀중한 거래는 금액을 다시 확인하세요.',blocks:[['물고기 판매','<span class="command">/판매</span><br>가장 가까운 물고기 판매 NPC를 안내합니다. 판매는 해당 NPC에게 진행합니다.'],['플레이어 마켓','<span class="command">/마켓</span><br>등록된 물건을 둘러봅니다.<br><span class="command">/마켓등록 &lt;가격&gt;</span><br>들고 있는 물건을 등록합니다.'],['안전한 금액 이동','<span class="command">/수표 &lt;금액&gt;</span><br>수표를 발행합니다. 송금과 거래 전에는 상대와 금액을 꼭 다시 확인하세요.'],['캐시','캐시는 게임 안 캐시상점에서 사용합니다. 웹 상점에서 충전·패키지 정보를 확인할 수 있어요.']]},
        {id:'cooking',group:'life',glyph:'🍲',title:'농사와 요리',desc:'섬에서 재료를 기르고, 요리로 버프와 제출을 준비하세요.',tags:'농사 작물 특수작물 요리 버프 제출',intro:'생활 콘텐츠는 낚시 밖에서도 성장 재료를 마련하는 방법입니다. 작물을 기르고 요리를 만들어 버프·제출·판매에 활용하세요.',blocks:[['작물 관리','<span class="command">/작물</span><br>특수작물 상태와 관리 정보를 확인합니다.'],['요리의 쓰임','요리는 먹어서 일시적인 낚시 버프를 얻고, 제출하거나 판매하는 데에도 사용할 수 있습니다.'],['섬 한도','특수작물과 가구 등은 섬 업그레이드에 따라 설치 한도가 달라집니다.'],['재료 수집','낚시·농사·채집·거래를 통해 필요한 재료를 모아 보세요.']]},
        {id:'casino',group:'economy',glyph:'♠',title:'카지노와 기록',desc:'게임을 즐기되, 순수익 랭킹은 기록으로만 확인하세요.',tags:'카지노 순수익 블랙잭 슬롯 룰렛 바카라 랭킹',intro:'카지노는 선택형 콘텐츠입니다. 게임별 결과는 기록되고, 웹 랭킹의 카지노 순수익은 모든 베팅 결과를 합산한 순이익 기준으로 표시됩니다.',blocks:[['순수익 기준','순수익은 획득액이 아니라 베팅을 제외한 최종 손익입니다. 양수인 플레이어만 순위에 표시됩니다.'],['랭킹 보기','<span class="command">웹사이트 → 랭킹 → 카지노 순수익</span><br>현재 기록 기준의 순위를 확인합니다.'],['플레이 원칙','잃어도 괜찮은 범위에서만 즐기고, 생활 자금과 장비 강화 재료는 따로 관리하는 편이 좋습니다.'],['다른 기록','낚시·자산·길드·섬 방문·인기도 랭킹도 웹에서 함께 볼 수 있습니다.']]},
        {id:'explore',group:'life',glyph:'🧭',title:'탐험·날씨·이동',desc:'지역별 날씨를 읽고 페리와 포탈로 새로운 어장을 찾으세요.',tags:'탐험 지역 날씨 비 뇌우 태풍 안개 페리 포탈 이동 도감',intro:'바르칸의 지역은 같은 물가라도 날씨와 시간에 따라 다른 모습을 보입니다. 이동수단과 환경 정보를 함께 활용하면 원하는 어종과 재료를 더 정확하게 찾아갈 수 있어요.',blocks:[['지역 정보','지역마다 환경과 출현 어종이 다릅니다. 도감과 현지 안내를 함께 확인하세요.'],['날씨','비·뇌우·태풍·안개 등은 지역 환경과 낚시에 영향을 줄 수 있습니다.'],['이동','페리와 포탈은 지역 사이를 이동하는 주요 수단입니다.'],['도감','<span class="command">/도감</span><br>발견한 어종과 수집 기록을 확인합니다.']]},
        {id:'quest',group:'start',glyph:'✎',title:'퀘스트와 NPC',desc:'메인·일일·주간 목표를 따라 바르칸의 이야기를 진행하세요.',tags:'퀘스트 메인 일일 주간 NPC 대화 보상 게시판',intro:'NPC 대화와 퀘스트는 새 지역과 시스템을 이해하는 가장 자연스러운 길잡이입니다. 당장 할 일이 없을 때는 퀘스트 목록과 게시판부터 확인해 보세요.',blocks:[['메인 퀘스트','스토리를 따라 바르칸의 주요 지역과 기능을 익힙니다.'],['일일·주간','반복 목표를 완료해 꾸준한 보상을 얻습니다.'],['NPC','대화형 NPC와 기능형 NPC는 역할이 다릅니다. 머리 위 표식을 확인하세요.'],['보상','퀘스트를 완료하기 전 요구 물품과 보상, 소지 공간을 확인하세요.']]},
        {id:'mining',group:'life',glyph:'⛏',title:'광질·제작·채집',desc:'낚시 밖의 재료 수집과 제작으로 생활 기반을 넓히세요.',tags:'광질 드릴 광석 제작 재료 채집 가공',intro:'광질과 제작은 장비·생활 콘텐츠에 필요한 재료를 마련하는 보조 성장 축입니다. 낚시만으로 부족한 재료가 있다면 광질과 제작 경로를 같이 살펴보세요.',blocks:[['광질','드릴과 광질 콘텐츠를 통해 광석과 재료를 수집합니다.'],['제작','재료를 조합해 필요한 아이템을 만들고 생활 콘텐츠와 연결합니다.'],['채집','지역 탐험 중 얻는 재료도 요리·제작의 기반이 됩니다.'],['거래','직접 만들기 어렵다면 마켓에서 재료의 시세를 확인할 수 있습니다.']]}
      ];
      const longDocs={
        start:`<section class="doc-section" id="start-overview"><h3>1. 시작 전 확인</h3><p>바르칸 열도는 Java Edition 기반의 낚시·탐험 서버입니다. 접속 주소는 <span class="command">barkan.kr</span>, 권장 접속 범위는 <strong>1.21.4 ~ 1.26.2</strong>입니다. 처음 접속했다면 항구의 안내를 따라 기본 장비와 이동 동선을 먼저 익히는 편이 좋습니다.</p><div class="fact-grid"><div class="fact"><b>Java</b><span>Bedrock은 지원하지 않아요.</span></div><div class="fact"><b>항구</b><span>첫 안내와 주요 NPC가 있는 시작 지점</span></div><div class="fact"><b>디스코드</b><span>오류·복구·공지 문의 창구</span></div></div></section><section class="doc-section" id="start-flow"><h3>2. 첫 항해 순서</h3><ol><li>항구 안내 NPC의 대화를 읽고 첫 낚싯대를 준비합니다.</li><li>물가에서 낚싯대를 사용해 입질을 기다립니다.</li><li>미니게임을 성공해 물고기를 얻고, 필요 없는 어획은 판매합니다.</li><li>레벨과 장비 메뉴를 열어 다음 목표와 장착 상태를 확인합니다.</li></ol><div class="callout">낚시 미니게임을 실패하거나 시간이 지나면 물고기가 도망가며, 콤보가 끊길 수 있습니다. 초반에는 어려운 물고기보다 성공률을 안정시키는 쪽이 좋습니다.</div></section><section class="doc-section" id="start-commands"><h3>3. 기본 명령어</h3><table class="doc-table"><thead><tr><th>명령어</th><th>용도</th></tr></thead><tbody><tr><td>/레벨</td><td>현재 낚시 레벨과 성장 로드맵 확인</td></tr><tr><td>/장비</td><td>낚싯대·부품·능력치·상태 확인</td></tr><tr><td>/판매</td><td>어획 판매 메뉴</td></tr><tr><td>/도감</td><td>발견한 물고기와 수집 기록 확인</td></tr><tr><td>/섬</td><td>개인 섬 생성 및 관리 메뉴</td></tr></tbody></table></section><section class="doc-section" id="start-help"><h3>4. 문제가 생겼다면</h3><p>아이템, 이동, 보상처럼 계정 확인이 필요한 문의는 디스코드에 <strong>닉네임·발생 시각·상황·가능하면 스크린샷</strong>을 함께 남겨 주세요. 반복해서 명령어를 입력하거나 접속을 끊기보다, 먼저 현 상태가 남아 있는지 확인하는 것이 복구에 도움이 됩니다.</p></section>`,
        fishing:`<section class="doc-section" id="fishing-overview"><h3>1. 낚시는 이렇게 결정됩니다</h3><p>한 번의 낚시는 <strong>지역·시간·날씨로 어종 풀 구성 → 등급 판정 → 어종 선택 → 크기 판정 → 미니게임 → 보상</strong> 순서로 진행됩니다. 같은 장소라도 시간과 날씨에 따라 만날 수 있는 어종이 달라지고, 해당 풀에 없는 등급은 등급 판정 자체에서 건너뜁니다.</p><div class="callout">아래 표는 스탯 0, 특화 없음 상태의 <strong>기본 1회 판정 확률</strong>입니다. 실제 출현 비율은 등급마다 쌓이는 PRD 천장 때문에 표의 숫자와 동일하지 않습니다.</div></section><section class="doc-section" id="fishing-rate"><h3>2. 등급 확률표</h3><table class="doc-table"><thead><tr><th>등급</th><th>기본 판정 확률</th><th>레벨 조건</th><th>비고</th></tr></thead><tbody><tr><td>G</td><td>0.0000175%</td><td>Lv.60+</td><td>최고 등급</td></tr><tr><td>L</td><td>0.0021%</td><td>Lv.45+</td><td>고레벨 어종 풀 필요</td></tr><tr><td>M</td><td>0.0105%</td><td>Lv.30+</td><td>중후반 등급</td></tr><tr><td>S</td><td>0.0165%</td><td>제한 없음</td><td>초반부터 판정 가능</td></tr><tr><td>A</td><td>0.0977%</td><td>제한 없음</td><td>희귀 등급</td></tr><tr><td>B</td><td>0.5712%</td><td>제한 없음</td><td>등급 해금 필요</td></tr><tr><td>C</td><td>7.13%</td><td>제한 없음</td><td>등급 해금 필요</td></tr><tr><td>D</td><td>21.12%</td><td>제한 없음</td><td>기본 등급</td></tr><tr><td>E</td><td>잔여 확률</td><td>제한 없음</td><td>위 판정이 모두 빗나갈 때</td></tr></tbody></table><p>등급은 G부터 D까지 희귀한 순서로 차례로 검사합니다. 먼저 성공한 등급으로 결정되므로, 각 행을 단순히 더한 값이 실제 전체 분포를 의미하지는 않습니다.</p></section><section class="doc-section" id="fishing-prd"><h3>3. 천장(PRD), 행운, 등급 특화</h3><p>각 희귀 등급(D~G)은 자신의 천장 카운터를 따로 가집니다. 해당 등급이 나오지 않은 캐치마다 카운터가 1씩 오르고, 그 등급이 나오면 그 등급의 카운터만 0으로 돌아갑니다.</p><p>현재 판정식은 <strong>기본 확률 × (1 + 해당 등급 천장) × 행운 배율 × 등급 특화 배율</strong>입니다. 행운 배율은 <strong>(100 + 행운) ÷ 100</strong>, 등급 특화는 대상 등급의 판정 확률만 높입니다. 예를 들어 특화 +50%는 대상 등급 확률에 1.5배를 적용하며, 등급을 바로 올려 주는 효과가 아닙니다.</p><div class="callout">지역 어종 풀에 없는 등급은 판정을 건너뛰므로 그 등급의 천장이 사라지지 않습니다. 해당 등급 어종이 있는 지역으로 가면 모아 둔 천장이 정상적으로 이어집니다.</div></section><section class="doc-section" id="fishing-level"><h3>4. 레벨별 등급 상한과 해금</h3><table class="doc-table"><thead><tr><th>낚시 레벨</th><th>도달 가능한 최대 등급</th></tr></thead><tbody><tr><td>Lv.1 ~ 29</td><td>S</td></tr><tr><td>Lv.30 ~ 44</td><td>M</td></tr><tr><td>Lv.45 ~ 59</td><td>L</td></tr><tr><td>Lv.60 이상</td><td>G</td></tr></tbody></table><p>B와 C는 별도의 등급 해금 상태도 확인합니다. 해금하지 않은 상태에서 B 이상이 판정되면 보유한 해금 상태에 맞춰 C 또는 D로 내려갈 수 있습니다. 레벨만 올렸는데 기대한 등급이 보이지 않는다면 등급 해금과 해당 지역의 어종 풀을 함께 확인하세요.</p></section><section class="doc-section" id="fishing-env"><h3>5. 지역·시간·날씨가 바꾸는 어종</h3><p>낚시 풀은 지역, 맑음·비·뇌우 같은 날씨, 새벽·밤 같은 시간 조건으로 구성됩니다. 현재 시간대의 주 풀은 100% 반영되고, 반대 시간대 풀은 25% 확률로 섞입니다. 그래서 밤 물고기가 낮에도 드물게 낚이거나, 낮 물고기가 밤에 섞여 나올 수 있습니다.</p><p>지역에 없는 등급은 확률이 아무리 높아도 잡히지 않습니다. 특정 어종을 노릴 때는 도감의 서식 정보와 현지 날씨를 먼저 보고 이동하는 것이 가장 확실합니다.</p></section><section class="doc-section" id="fishing-size"><h3>6. 크기·경험치·등급업</h3><p>범위 등급 어종은 최소~최대 크기 구간을 등급 수만큼 나눕니다. 상위 등급일수록 더 큰 구간에서 크기가 뽑히므로, 등급이 오르면 기본적으로 큰 개체를 만날 가능성도 커집니다. 크기 점수는 해당 개체가 뽑힌 구간 안에서 계산됩니다.</p><p>기본 경험치는 등급과 크기 점수로 정해진 뒤, 장비 경험치 보너스와 환경 보너스가 합산 적용됩니다. 크리티컬은 추가 경험치와 크기·판매 보상에 영향을 주며, 콤보는 5콤보마다 추가 보너스를 만듭니다. 장비 등급업과 환경 등급업은 등급 판정 뒤 한 단계 높은 가용 등급으로 올릴 기회를 제공합니다.</p><table class="doc-table"><thead><tr><th>등급</th><th>기본 경험치</th></tr></thead><tbody><tr><td>E</td><td>1</td></tr><tr><td>D</td><td>3</td></tr><tr><td>C</td><td>4</td></tr><tr><td>B</td><td>6</td></tr><tr><td>A</td><td>12</td></tr><tr><td>S</td><td>30</td></tr><tr><td>M</td><td>200</td></tr><tr><td>L</td><td>800</td></tr><tr><td>G</td><td>3,000</td></tr></tbody></table></section><section class="doc-section" id="fishing-play"><h3>7. 실전 팁</h3><ul><li>초반에는 레벨 상한보다 성공률과 장비 상태를 먼저 안정시키세요.</li><li>희귀 등급을 노린다면 해당 등급이 있는 지역인지, 해금이 되었는지부터 확인하세요.</li><li>큰 물고기는 보상과 경험치에 유리하지만 미니게임 난이도도 함께 올라갑니다.</li><li>보관할 어획은 아이스박스로 신선도를 관리하고, 판매할 어획은 <span class="command">/판매</span>에서 처리하세요.</li></ul></section>`,
        gear:`<section class="doc-section" id="gear-overview"><h3>1. 장비의 역할</h3><p>낚싯대는 낚시의 기반이고, 릴·줄·바늘·미끼·찌 같은 부품은 각기 다른 보너스를 더합니다. 장비는 단순히 높은 등급 하나를 고르는 구조가 아니라, 목표 어종과 플레이 방식에 맞춰 능력치를 조합하는 시스템입니다.</p><div class="fact-grid"><div class="fact"><b>/장비</b><span>현재 세팅과 능력치 확인</span></div><div class="fact"><b>/강화</b><span>낚싯대별 강화 메뉴</span></div><div class="fact"><b>/부품상점</b><span>부품 구매와 탐색</span></div></div></section><section class="doc-section" id="gear-stats"><h3>2. 확인할 능력치</h3><p>장비 조합은 등급업, 행운, 경험치, 크기, 판매 보너스, 크리티컬, 도주 감소, 내구 보존처럼 서로 다른 방향의 수치를 제공합니다. 어느 한 수치만 높이기보다, 현재 사냥터에서 미니게임 성공이 가능한지와 목표가 레벨 성장인지 판매 수익인지부터 정하고 세팅하세요.</p><p>장비 효과에는 레벨 제한이 있을 수 있습니다. 새 부품을 얻어도 즉시 장착이 되지 않는다면 필요한 낚시 레벨을 먼저 확인하면 됩니다.</p></section><section class="doc-section" id="gear-enhance"><h3>3. 강화와 내구도</h3><p>강화는 낚싯대 단위로 진행됩니다. 강화 전에는 재료와 현재 장비의 역할을 확인하고, 실패나 하락 가능성을 고려해 여유 자원을 두는 편이 안전합니다. 내구도도 장비 관리의 일부이므로 장시간 낚시 전후로 장비 메뉴를 확인하세요.</p><div class="callout">장비를 바꾼 뒤에는 표기된 수치만 보지 말고 실제 미니게임 난이도·도주율·보상 변화까지 확인해 보세요. 같은 보너스라도 지역 환경과 함께 적용될 때 체감이 달라질 수 있습니다.</div></section><section class="doc-section" id="gear-parts"><h3>4. 부품을 얻는 법</h3><p>부품은 상점, 콘텐츠 보상, 분해와 조각 합성 같은 경로로 확보합니다. 필요 없는 부품은 분해해 다음 제작의 재료로 돌릴 수 있고, 같은 목표 등급을 오래 노린다면 거래와 마켓도 좋은 보조 수단입니다.</p></section>`,
        island:`<section class="doc-section"><h3>1. 개인 섬이란?</h3><p>개인 섬은 생활 콘텐츠를 직접 꾸리고 다른 플레이어에게 보여 줄 수 있는 공간입니다. 농사·가구·제작·워프를 운영하면서 본인만의 항구를 만들 수 있고, 공개 설정을 통해 방문자를 받을 수 있습니다.</p><div class="fact-grid"><div class="fact"><b>/섬</b><span>생성 및 관리 메뉴</span></div><div class="fact"><b>/섬 방문 닉네임</b><span>공개 섬 방문</span></div><div class="fact"><b>/섬 초대 닉네임</b><span>알바생 초대</span></div></div></section><section class="doc-section"><h3>2. 생성부터 공개까지</h3><ol><li><span class="command">/섬</span>에서 자신의 섬을 생성합니다.</li><li>관리 메뉴에서 워프, 방문 허용, 권한을 원하는 방식으로 설정합니다.</li><li>방문자를 받을 준비가 됐다면 공개 상태를 확인하고 섬을 꾸밉니다.</li><li>다른 섬은 <span class="command">/섬 방문 &lt;닉네임&gt;</span>으로 이동합니다.</li></ol><p>섬은 보호 구역이므로 초대받지 않은 방문자가 건축이나 보관함을 마음대로 조작할 수는 없습니다. 함께 작업할 사람이 있다면 권한을 명확하게 구분하세요.</p></section><section class="doc-section"><h3>3. 방문자 수와 랭킹</h3><p>공개 섬의 방문 기록은 웹 랭킹의 섬 방문 탭에 반영됩니다. 방문자 수를 늘리고 싶다면 첫 워프 지점을 정돈하고, 테마·편의 시설·체험 요소처럼 다시 찾을 이유를 만드는 것이 좋습니다. 단순히 출입구만 열기보다 섬 안에서 무엇을 볼 수 있는지 안내해 주세요.</p></section><section class="doc-section"><h3>4. 생활 한도와 업그레이드</h3><p>특수작물, 가구, 워프처럼 섬 안에서 사용할 수 있는 시설에는 한도가 적용될 수 있습니다. 섬 업그레이드는 이 한도를 넓히는 성장 수단입니다. 설치가 되지 않는다면 빈 공간보다 먼저 해당 시설의 섬 한도를 확인하세요.</p></section>`,
        guild:`<section class="doc-section"><h3>1. 길드의 목표</h3><p>길드는 여러 플레이어가 함께 자원과 기여를 모으는 공동체입니다. 길드원 레벨, 제출 기여, 금고와 인원이 함께 길드 성장에 반영되며, 길드 전용 공간에서 건축과 운영을 이어갈 수 있습니다.</p><div class="fact-grid"><div class="fact"><b>레벨</b><span>길드원 성장도 점수에 반영</span></div><div class="fact"><b>제출</b><span>함께 쌓는 공동 기여</span></div><div class="fact"><b>금고</b><span>길드 운영을 위한 자금</span></div></div></section><section class="doc-section"><h3>2. 길드 랭킹 기준</h3><p>웹 길드 랭킹은 길드 레벨, 길드원 수, 길드원 낚시 레벨, 제출 누계, 금고 등을 종합한 서버 기록을 기준으로 표시합니다. 단순히 사람 수만 늘리는 것보다 각자 성장하고 기여하는 길드가 좋은 결과를 냅니다.</p><div class="callout">길드 섬은 길드 전용 공간입니다. 길드에 가입하지 않은 플레이어는 정상적으로 머무를 수 없으므로, 초대·가입 상태를 먼저 확인해 주세요.</div></section><section class="doc-section"><h3>3. 함께 운영하는 법</h3><p>길드에는 역할을 나누는 것이 좋습니다. 낚시와 재료 수집, 생활 콘텐츠, 섬 건축, 거래와 금고 관리를 나누면 목표가 분명해집니다. 금고와 공용 자원은 신뢰가 필요한 영역이므로 운영 규칙을 미리 정하고 길드 채널에 남겨 두세요.</p></section><section class="doc-section"><h3>4. 시즌과 기록</h3><p>일부 기여 기록은 시즌 운영에 따라 초기화되거나 별도 집계될 수 있습니다. 장기 기록과 시즌 점수를 혼동하지 않도록 길드 안내와 공지를 함께 확인하세요.</p></section>`,
        economy:`<section class="doc-section"><h3>1. 돈을 버는 기본 흐름</h3><p>바르칸의 기본 경제는 어획 판매에서 시작합니다. 물고기의 등급, 크기, 신선도와 각종 판매 보너스가 가치에 반영됩니다. 바로 쓸 자금은 판매로 만들고, 희귀 어획과 재료는 보관·제출·거래 중 목적에 맞게 선택하세요.</p><div class="fact-grid"><div class="fact"><b>/판매</b><span>어획을 판매</span></div><div class="fact"><b>/마켓</b><span>플레이어 등록 물품</span></div><div class="fact"><b>/수표 금액</b><span>금액 수표 발행</span></div></div></section><section class="doc-section"><h3>2. 마켓과 개인 거래</h3><p><span class="command">/마켓</span>에서는 플레이어가 올린 물건을 둘러볼 수 있고, <span class="command">/마켓등록 &lt;가격&gt;</span>으로 손에 든 물건을 등록할 수 있습니다. 거래 전에는 아이템 이름·등급·수량·최종 가격을 반드시 다시 확인하세요. 채팅 약속만으로 급하게 거래하기보다 게임 안 시스템을 이용하는 편이 안전합니다.</p></section><section class="doc-section"><h3>3. 보관과 신선도</h3><p>바로 팔지 않을 물고기는 아이스박스에 보관해 신선도를 관리합니다. 신선도는 판매 가치에 영향을 줄 수 있으므로, 장식이나 거래를 위해 오래 들고 있을 어획일수록 보관을 먼저 고려하세요.</p></section><section class="doc-section"><h3>4. 캐시와 웹 상점</h3><p>캐시는 게임 안 캐시상점에서 사용하는 별도 재화입니다. 충전·이용권·패키지는 웹 상점에서 확인하며, 결제나 후원과 관련된 문의는 상점에 표시된 안내 채널을 이용하세요. 플레이어 간 현금 거래나 계정 거래는 지원하지 않습니다.</p></section>`,
        cooking:`<section class="doc-section"><h3>1. 농사와 요리의 자리</h3><p>농사와 요리는 낚시 밖에서 재료를 만들고 성장 효율을 조절하는 생활 콘텐츠입니다. 섬에서 특수작물을 기르고, 모은 재료로 요리를 만들어 먹거나 제출·판매에 활용할 수 있습니다.</p><div class="fact-grid"><div class="fact"><b>/작물</b><span>작물 상태와 관리 정보</span></div><div class="fact"><b>요리</b><span>버프·제출·판매의 세 가지 용도</span></div><div class="fact"><b>섬 업그레이드</b><span>설치 가능 한도 확대</span></div></div></section><section class="doc-section"><h3>2. 요리 버프</h3><p>요리를 먹으면 일정 시간 낚시에 도움이 되는 버프를 얻을 수 있습니다. 동시에 여러 종류를 겹쳐 쓰기보다 현재 활성 상태를 확인하고, 필요한 상황에 맞는 한 가지 효과를 선택하세요. 버프는 장비를 대체하기보다 특정 목적을 보완하는 수단입니다.</p></section><section class="doc-section"><h3>3. 재료 수집과 제출</h3><p>재료는 낚시, 특수작물, 제작, 거래처럼 여러 경로에서 모입니다. 직접 쓸 요리와 길드·콘텐츠 제출용 재료를 분리해 두면 갑자기 필요한 재료가 생겼을 때 덜 흔들립니다. 판매하기 전에는 해당 요리가 제출처에서 더 높은 가치를 갖는지 확인하는 습관이 좋습니다.</p></section><section class="doc-section"><h3>4. 섬에서의 관리</h3><p>특수작물의 설치와 관리에는 개인 섬 한도가 적용됩니다. 새로운 작물을 늘리기 전에 섬 공간뿐 아니라 업그레이드 상태와 현재 설치 수를 확인하세요. 작물은 생활 콘텐츠이면서 요리 재료의 공급망이므로, 꾸준히 관리할 수 있는 규모부터 시작하는 편이 좋습니다.</p></section>`,
        casino:`<section class="doc-section"><h3>1. 카지노는 선택형 콘텐츠입니다</h3><p>카지노는 생활·낚시 성장과 별개로 즐길 수 있는 선택형 콘텐츠입니다. 결과는 기록되며, 웹 랭킹에서는 획득 총액이 아니라 베팅을 모두 반영한 <strong>순수익</strong>을 기준으로 표시합니다.</p><div class="callout">카지노 랭킹은 자산 랭킹이 아닙니다. 순수익이 양수인 기록만 순위에 표시되므로, 한 번의 큰 베팅 결과만으로 전체 경제력이 판단되지는 않습니다.</div></section><section class="doc-section"><h3>2. 순수익의 의미</h3><p>순수익은 카지노에서 얻은 금액에서 잃은 금액을 반영한 최종 손익입니다. 따라서 상금이 커 보여도 그만큼 베팅했다면 랭킹 수치는 다르게 보일 수 있습니다. 웹 랭킹의 카지노 탭은 이 기록을 서버 로그 기준으로 집계합니다.</p></section><section class="doc-section"><h3>3. 즐기는 기준</h3><ul><li>장비 강화나 거래에 쓸 필수 자금은 따로 남겨 두세요.</li><li>정한 한도를 넘겼다면 잠시 다른 콘텐츠로 돌아가는 것이 좋습니다.</li><li>카지노 손익과 개인 자산은 서로 다른 랭킹 항목으로 확인하세요.</li><li>오류가 의심되면 닉네임·게임 종류·시각을 포함해 문의하세요.</li></ul></section><section class="doc-section"><h3>4. 함께 보는 기록</h3><p>웹 랭킹에서는 낚시 레벨·누적 어획·자산·길드·섬 방문·인기도도 함께 확인할 수 있습니다. 한 가지 기록만으로 플레이어를 판단하기보다, 어떤 방식으로 바르칸을 즐기고 있는지 보는 용도로 이용해 주세요.</p></section>`,
        explore:`<section class="doc-section" id="explore-region"><h3>1. 지역은 어종 풀이 다릅니다</h3><p>바르칸 열도는 지역마다 낚시 풀과 환경이 다릅니다. 같은 등급이라도 해당 지역에 어종이 있어야만 잡을 수 있으니, 목적 어종이 있다면 도감의 서식 정보와 현장 안내를 먼저 확인하세요.</p><div class="fact-grid"><div class="fact"><b>/도감</b><span>발견 기록과 어종 정보 확인</span></div><div class="fact"><b>/날씨</b><span>현재 환경 확인</span></div><div class="fact"><b>페리</b><span>지역 사이의 주요 이동 수단</span></div></div></section><section class="doc-section" id="explore-weather"><h3>2. 날씨와 시간</h3><p>각 지역은 비, 뇌우, 태풍, 안개, 눈보라 같은 환경을 가질 수 있습니다. 환경은 단순 배경이 아니라 어종 풀과 낚시 조건에 연결됩니다. 새벽·밤 등 시간대도 함께 보며, 특정 어종을 노릴 때는 날씨가 바뀌기를 기다리거나 다른 지역으로 이동하세요.</p></section><section class="doc-section" id="explore-move"><h3>3. 페리·포탈·안전한 이동</h3><p>장거리 이동은 지역의 페리와 포탈을 이용합니다. 이동 전에 소지품과 목적지를 확인하고, 낚시 중이거나 미니게임이 진행 중일 때는 이동을 시도하지 않는 편이 좋습니다. 길을 잃었을 때는 항구와 지역 안내 NPC를 기준점으로 다시 동선을 잡으세요.</p></section><section class="doc-section" id="explore-collect"><h3>4. 도감과 탐험 기록</h3><p>도감은 새 물고기를 찾아내는 과정 자체를 기록합니다. 처음 가 보는 지역에서는 무작정 고등급을 노리기보다, 그 지역의 기본 어종과 시간·날씨 조건을 채우는 것부터 시작하면 다음 목표가 선명해집니다.</p></section>`,
        quest:`<section class="doc-section" id="quest-types"><h3>1. 퀘스트 종류</h3><p>메인 퀘스트는 바르칸의 이야기와 주요 기능을 안내하고, 일일·주간 퀘스트는 반복 가능한 목표를 제공합니다. 새 기능이 열렸는데 사용법이 애매하다면 퀘스트 대화와 해당 NPC의 안내를 먼저 읽어 보세요.</p><table class="doc-table"><thead><tr><th>종류</th><th>역할</th></tr></thead><tbody><tr><td>메인</td><td>스토리 진행과 지역·기능 안내</td></tr><tr><td>일일</td><td>매일 갱신되는 짧은 목표</td></tr><tr><td>주간</td><td>조금 더 긴 주간 목표</td></tr></tbody></table></section><section class="doc-section" id="quest-npc"><h3>2. NPC를 읽는 법</h3><p>NPC 머리 위 색과 표식은 역할을 구분하는 힌트입니다. 기능형 NPC는 상점·제작·이동처럼 메뉴를 열어 주고, 스토리 NPC는 대화와 퀘스트를 이어 줍니다. 같은 이름의 NPC를 찾는다면 지도보다 먼저 현재 퀘스트 설명의 장소 단서를 확인하세요.</p></section><section class="doc-section" id="quest-complete"><h3>3. 완료 전 체크</h3><ol><li>퀘스트가 요구하는 아이템·등급·수량을 다시 확인합니다.</li><li>제출형 목표는 한 번 제출하면 되돌리기 어려우므로 필요한 개인 재고를 남깁니다.</li><li>보상 수령 전에 인벤토리 공간을 비워 둡니다.</li><li>완료가 반영되지 않으면 재접속보다 먼저 조건과 진행 문구를 확인합니다.</li></ol></section><section class="doc-section" id="quest-help"><h3>4. 진행 오류 문의</h3><p>퀘스트명, 진행 단계, 요구 조건을 만족한 시각, 닉네임을 함께 적어 문의해 주세요. 단순히 “안 돼요”보다 현재 대화문과 인벤토리 상태를 보여 주면 원인을 훨씬 빨리 확인할 수 있습니다.</p></section>`,
        mining:`<section class="doc-section" id="mining-overview"><h3>1. 광질과 제작의 역할</h3><p>광질은 낚시와 다른 방식으로 재료를 모으는 생활 축입니다. 드릴과 광질 장비로 광석을 수집하고, 제작·요리·거래에 필요한 기반 재료를 보충할 수 있습니다.</p><div class="fact-grid"><div class="fact"><b>광질</b><span>광석과 재료 수집</span></div><div class="fact"><b>제작</b><span>수집 재료를 필요한 아이템으로 가공</span></div><div class="fact"><b>마켓</b><span>부족한 재료의 거래 경로</span></div></div></section><section class="doc-section" id="mining-loop"><h3>2. 기본 순환</h3><ol><li>광질 장비와 이동할 지역을 준비합니다.</li><li>광석·재료를 모으고 필요한 가공 재료를 분류합니다.</li><li>직접 제작할지, 요리·제출에 쓸지, 마켓에 거래할지 결정합니다.</li><li>낚시 장비 강화나 생활 시설에 필요한 재료를 우선순위로 둡니다.</li></ol></section><section class="doc-section" id="mining-craft"><h3>3. 제작과 재료 관리</h3><p>제작은 단발성 소비보다 앞으로 필요한 재료의 흐름을 보고 접근하는 것이 좋습니다. 당장 쓰지 않는 광석도 다음 장비나 요리의 재료가 될 수 있으므로, 시세가 낮은 날에는 보관하고 부족한 재료만 거래로 메우는 방식도 유효합니다.</p></section><section class="doc-section" id="mining-safety"><h3>4. 생활 콘텐츠를 함께 쓰기</h3><p>광질, 농사, 요리, 낚시는 경쟁 관계가 아니라 서로 재료와 보상을 연결하는 콘텐츠입니다. 한 가지 활동에서 막히면 다른 생활 활동으로 필요한 재료를 마련할 수 있으니, 모든 자금을 한 경로에만 쓰기보다 역할을 나누어 관리하세요.</p></section>`
      };
      const groups={all:'바르칸을 알아가기',start:'처음 시작',fishing:'낚시와 장비',life:'섬 생활',community:'함께하기',economy:'경제'};
      const relatedDocs={
        start:['fishing','quest','explore'], fishing:['gear','explore','economy'], gear:['fishing','economy','cooking'],
        island:['cooking','guild','explore'], guild:['island','economy','quest'], economy:['fishing','gear','casino'],
        cooking:['island','fishing','mining'], casino:['economy','fishing','guild'], explore:['fishing','quest','island'],
        quest:['start','explore','guild'], mining:['cooking','island','gear']
      };
      const guides=document.querySelector('#guides'), article=document.querySelector('#article'), search=document.querySelector('#search'), count=document.querySelector('#search-count'), empty=document.querySelector('#empty'), title=document.querySelector('#section-title');
      let filter='all', query='';
      const escape=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      function render(){const visible=docs.filter(doc=>(filter==='all'||doc.group===filter)&&(`${doc.title} ${doc.desc} ${doc.tags}`).toLowerCase().includes(query.toLowerCase()));guides.innerHTML=visible.map(doc=>`<a class="guide" href="/wiki/${encodeURIComponent(doc.id)}"><span class="glyph">${doc.glyph}</span><h3>${doc.title}</h3><p>${doc.desc}</p><span>문서 열기 →</span></a>`).join('');empty.classList.toggle('show',!visible.length);count.textContent=query?`${visible.length}개의 문서를 찾았습니다.`:`${visible.length}개의 안내 문서`;title.textContent=groups[filter];}
      function detailHtml(doc){let sectionNo=0;const detailed=(longDocs[doc.id]||'').replaceAll('Java Edition 기반의 낚시·탐험 서버입니다.','Java·Bedrock 크로스플레이를 지원하는 낚시·탐험 서버입니다.').replaceAll('<b>Java</b><span>Bedrock은 지원하지 않아요.</span>','<b>Java · Bedrock</b><span>Geyser 크로스플레이 접속 지원</span>').replaceAll('<td>/판매</td><td>어획 판매 메뉴</td>','<td>/판매</td><td>가까운 물고기 판매 NPC 안내</td>').replaceAll('판매할 어획은 <span class="command">/판매</span>에서 처리하세요.','판매할 어획은 <span class="command">/판매</span>으로 가까운 판매 NPC를 찾은 뒤 판매하세요.').replaceAll('<b>/판매</b><span>어획을 판매</span>','<b>/판매</b><span>가까운 판매 NPC 안내</span>').replaceAll('내구도가 떨어진 장비는 성능에 영향을 받을 수 있으니 장비 상태를 수시로 확인하세요.','장시간 낚시 전후로 장비 상태를 수시로 확인하세요.').replaceAll('요리는 먹어서 일시적인 낚시 버프를 얻고, 제출하거나 판매하는 데에도 사용할 수 있습니다.','요리는 버프·제출·회복·판매 전용으로 나뉘며, 각 요리의 쓰임은 아이템 설명에서 확인할 수 있습니다.').replaceAll('먹어서 일시적인 낚시 버프를 얻고, 제출하거나 판매하는 데에도','버프용 또는 제출용으로 활용하고 판매할 수도').replaceAll('요리를 먹으면 일정 시간 낚시에 도움이 되는 버프를 얻을 수 있습니다.','버프용 요리를 먹으면 일정 시간 낚시에 도움이 되는 버프를 얻을 수 있습니다.').replaceAll('제출소에서 자원을 제출하면 섬과 길드 점수가 함께 쌓입니다. 시즌 점수는 월간 단위로 초기화될 수 있습니다.','제출 기여는 길드 성장 기록에 반영됩니다. 시즌 운영 여부와 보상은 서버 공지를 확인하세요.').replaceAll('공개 섬의 방문 기록은 웹 랭킹의 섬 방문 탭에 반영됩니다.','섬 방문 랭킹은 섬장·알바생을 제외한 외부 방문의 누적 횟수를 기준으로 합니다.').replaceAll('방문자 수를 늘리고 싶다면','누적 방문을 늘리고 싶다면').replace(/<section class="doc-section"(?![^>]*\bid=)/g,()=>`<section class="doc-section" id="${doc.id}-section-${++sectionNo}"`);const toc=detailed.match(/id="([^"]+)"[^>]*><h3>([^<]+)/g)||[];const tocLinks=toc.map(item=>{const id=item.match(/id="([^"]+)/)[1],label=item.match(/<h3>([^<]+)/)[1];return `<a href="#${id}">${label}</a>`}).join('');const fallback=`<div class="article-grid">${doc.blocks.map(([heading,body])=>`<section class="note"><h3>${heading}</h3><p>${body}</p></section>`).join('')}</div>`;const related=(relatedDocs[doc.id]||[]).map(id=>docs.find(item=>item.id===id)).filter(Boolean);const relatedLinks=`<nav class="related-docs"><b>관련 링크</b>${related.map(item=>`<a href="/wiki/${encodeURIComponent(item.id)}">${item.glyph} ${item.title}</a>`).join('')}<a href="/ranking">♜ 전체 랭킹</a><a href="https://discord.gg/fWVGGEbBsd" target="_blank" rel="noopener noreferrer">◉ 디스코드</a></nav>`;return `<div class="article-top"><div><p>BARKAN WIKI · ${doc.glyph}</p><h2>${doc.title}</h2></div><a class="article-close" href="/wiki">위키 홈</a></div>${tocLinks?`<nav class="doc-toc"><b>이 문서의 목차</b>${tocLinks}</nav>`:''}<p class="article-intro">${doc.intro}</p>${detailed||fallback}${relatedLinks}`;}
      function open(id){window.location.assign(`/wiki/${encodeURIComponent(id)}`);}
      function showDirectArticle(id){const doc=docs.find(item=>item.id===id);if(!doc)return false;document.body.classList.add('detail-page');document.title=`${doc.title} — 바르칸 위키`;document.querySelector('.masthead .kicker').textContent='BARKAN WIKI · FIELD GUIDE';document.querySelector('.masthead h1').innerHTML=`<em>${doc.title}</em>`;article.innerHTML=detailHtml(doc);article.classList.add('show');return true;}
      document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(item=>item.classList.toggle('active',item===button));render();}));search.addEventListener('input',()=>{query=search.value.trim();render()});
      const slug=decodeURIComponent(location.pathname.replace(/^\/wiki\/?/,'').replace(/\/+$/,''));
      if(!slug||!showDirectArticle(slug)) render();
    })();
  </script>
